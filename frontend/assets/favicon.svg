<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b36" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <g filter="url(#glow)">
    <!-- Upward Trend Chart Line & Arrow -->
    <path d="M 120 370 L 220 290 L 280 330 L 390 220" fill="none" stroke="url(#chartGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="390,195 425,230 365,245" fill="#a5f3fc" />
    
    <!-- Bar Chart Pills -->
    <rect x="180" y="340" width="22" height="50" rx="11" fill="#38bdf8" opacity="0.85" />
    <rect x="225" y="315" width="22" height="75" rx="11" fill="#38bdf8" opacity="0.9" />
    <rect x="270" y="345" width="22" height="45" rx="11" fill="#818cf8" opacity="0.85" />
    <rect x="315" y="285" width="22" height="105" rx="11" fill="#818cf8" opacity="0.95" />
    <rect x="360" y="260" width="22" height="130" rx="11" fill="#a5f3fc" />

    <!-- Ascending Airplane Silhouette -->
    <g transform="translate(140, 100) rotate(-15)">
      <path d="M 180 50 C 230 15 270 20 280 40 C 290 60 270 90 230 130 L 150 200 L 140 180 L 175 140 L 90 155 L 60 140 L 95 115 L 60 80 L 80 75 L 125 95 Z" fill="url(#planeGrad)" />
      <!-- Motion Speed Trails -->
      <path d="M 50 170 C 80 160 110 165 130 175" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.7" />
      <path d="M 30 190 C 70 180 100 185 120 195" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" opacity="0.5" />
    </g>
  </g>
</svg>
